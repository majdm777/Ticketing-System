name: Expire pending holds

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Run expiry sweep
        run: |
          response=$(curl --fail-with-body \
            --request POST \
            --max-time 30 \
            --connect-timeout 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://${{ vars.APP_URL }}/api/cron/expire-pending")
          echo "$response" | jq -e '.ok == true and (.expired | type == "number")'
